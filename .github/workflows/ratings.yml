name: Backfill ratings

on:
  schedule:
    # After crawler (02:17) and block refreshes (03:23–05:23)
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "MDBList lookups this run (default 900)"
        required: false
        default: "900"

concurrency:
  group: ratings-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Backfill MDBList ratings
        run: |
          limit="${{ github.event.inputs.limit }}"
          [ -n "$limit" ] || limit=900
          bun run scripts/blocks/manual/backfill-ratings.ts --limit="$limit"
